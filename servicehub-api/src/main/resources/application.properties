# ==== Identidade da aplicação ====
spring.application.name=servicehub-api

# ==== Porta do servidor embutido (Tomcat) ====
server.port=8080

# ==== Banco de dados: H2 em memória ====
# Por padrão o projeto sobe com H2, sem precisar instalar Postgres,
# para o checkpoint rodar em qualquer máquina "do zero".
spring.datasource.url=jdbc:h2:mem:servicehub
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==== JPA / Hibernate ====
# create-drop: recria o schema a cada start (bom para dev/demo).
# Em um ambiente real, use "update" ou, melhor ainda, uma ferramenta de
# migração como Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==== Swagger / OpenAPI ====
# Com springdoc no pom.xml, isso já habilita:
#   /v3/api-docs        -> especificação OpenAPI em JSON
#   /swagger-ui.html     -> interface visual do Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
