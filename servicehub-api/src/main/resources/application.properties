# ==== Identidade ====
spring.application.name=servicehub-api
app.version=@project.version@

# ==== Servidor ====
# Porta padrao da bancada de testes (Mapa, secao 12)
server.port=${SERVER_PORT:8090}
server.error.include-stacktrace=never
server.error.include-message=never

# ==== Banco de dados ====
# Padrao: H2 em memoria no modo PostgreSQL (roda sem instalar nada).
# Para PostgreSQL de verdade use o profile "postgres" (veja application-postgres.properties).
spring.datasource.url=${DB_URL:jdbc:h2:mem:servicehub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# ==== JPA ====
# O banco evolui SOMENTE por migracao Flyway; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ==== Flyway ====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# No PostgreSQL as colunas longas sao TEXT (profile postgres). No H2 usamos VARCHAR grande.
spring.flyway.placeholders.textType=VARCHAR(4000)

# ==== Paginacao (Mapa, secao 5): padrao 20, maximo 100 ====
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ==== Datas ====
spring.jackson.time-zone=America/Sao_Paulo

# ==== JWT (Mapa, secao 10) ====
# Sem JWT_SECRET (minimo 32 bytes) a aplicacao NAO sobe.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=86400

# ==== CORS: origens explicitas (nunca * com credenciais) ====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==== ADMIN inicial criado no startup a partir de variaveis de ambiente ====
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_NAME:Administrador}

# ==== Documentacao: Swagger UI em /docs, OpenAPI em /api-docs ====
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# ==== GraphQL (endpoint alternativo, somente leitura) ====
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=false

# ==== Actuator: health publico; metrics/prometheus so para ADMIN ====
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never
