# Ative este profile com: java -jar app.jar --spring.profiles.active=postgres
# (ou defina a variável de ambiente SPRING_PROFILES_ACTIVE=postgres)
#
# Suba um Postgres local rapidamente com:
#   docker run --name servicehub-db -e POSTGRES_PASSWORD=postgres \
#     -e POSTGRES_DB=servicehub -p 5432:5432 -d postgres:16

spring.datasource.url=jdbc:postgresql://localhost:5432/servicehub
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Desabilita o console do H2, que não faz sentido com Postgres
spring.h2.console.enabled=false
