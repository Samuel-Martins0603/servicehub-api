# Profile "postgres": use com  SPRING_PROFILES_ACTIVE=postgres
# (o docker-compose.yml ja faz isso). Valores vem de variaveis de ambiente (.env).

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servicehub}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# No PostgreSQL o schema fica identico ao da secao 3 do Mapa: colunas longas = TEXT
spring.flyway.placeholders.textType=TEXT
