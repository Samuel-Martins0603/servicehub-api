# Profile "test": H2 isolado por contexto, segredo JWT de teste e ADMIN inicial conhecido.
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
app.jwt.secret=segredo-de-teste-com-mais-de-32-bytes-0123456789
app.admin.email=admin@servicehub.test
app.admin.password=Admin1234
app.cors.allowed-origins=http://localhost:5173
spring.main.banner-mode=off
