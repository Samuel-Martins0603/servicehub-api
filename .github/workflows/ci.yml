name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: servicehub-api/pom.xml
      # Testcontainers usa o Docker do runner; os testes definem o proprio JWT_SECRET.
      - name: Build e testes
        working-directory: servicehub-api
        run: mvn -B verify
